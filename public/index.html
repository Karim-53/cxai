<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f4f1">
  <title>Compare-xAI · A benchmark for feature importance explainable AI</title>
  <meta name="description"
    content="Compare-xAI is an open benchmark that evaluates explainable AI (xAI) algorithms — SHAP, LIME, Integrated Gradients and more — with functional unit tests. Filter by your use case, rank explainers by comprehensibility and runtime, and read the limits of each explanation.">
  <link rel="canonical" href="https://karim-53.github.io/cxai/">
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Compare-xAI · A benchmark for feature importance explainable AI">
  <meta property="og:description"
    content="Explore, sort and filter the Compare-xAI benchmark results for explainable AI algorithms — entirely in your browser.">
  <meta property="og:url" content="https://karim-53.github.io/cxai/">
  <meta property="og:image" content="https://karim-53.github.io/cxai/rich_result/benchmark.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Apply the stored / preferred colour scheme before first paint. -->
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem('cxai-theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#131312' : '#f5f4f1');
      } catch (e) { /* storage disabled: fall back to the light theme */ }
    })();
  </script>
  <style>
    /* Shown while the JavaScript bundle and the SQLite database download. */
    html { background: #f5f4f1; }
    html[data-theme="dark"] { background: #131312; }
    #boot {
      min-height: 70vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; color: #52514e; font: 400 1rem/1.6 ui-sans-serif, system-ui,
      -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html[data-theme="dark"] #boot { color: #c3c2b7; }
    #boot span {
      width: 2rem; height: 2rem; border-radius: 50%; border: 3px solid rgba(120,118,111,.35);
      border-top-color: #2a78d6; animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
  </style>

  <!-- https://developers.google.com/search/docs/advanced/structured-data/how-to -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "How to compare explainable AI algorithms (xAI)",
      "totalTime": "PT5M",
      "image": {
        "@type": "ImageObject",
        "url": "https://karim-53.github.io/cxai/rich_result/benchmark_restricted.png",
        "height": "846",
        "width": "793"
      },
      "supply": [
        {
          "@type": "HowToSupply",
          "name": "benchmark"
        }, {
          "@type": "HowToSupply",
          "name": "evaluate"
        }, {
          "@type": "HowToSupply",
          "name": "test"
        }, {
          "@type": "HowToSupply",
          "name": "assess"
        }
      ],
      "step": [
        {
          "@type": "HowToStep",
          "url": "https://karim-53.github.io/cxai/#Filters",
          "name": "Shortlist xAI(s) that fits your needs using the following checklist",
          "itemListElement": [{
            "@type": "HowToDirection",
            "text": "Select the checkboxes describing your use case (AI model, dataset structure, etc.)."
          }, {
            "@type": "HowToDirection",
            "text": "Make sure to not eliminate all xAI algorithms by selecting too much requirements."
          }],
          "image": {
            "@type": "ImageObject",
            "url": "https://karim-53.github.io/cxai/rich_result/filters.png",
            "height": "254",
            "width": "755"
          }
        }, {
          "@type": "HowToStep",
          "name": "Evaluate selected xAI using an intuitive scoring method",
          "url": "https://karim-53.github.io/cxai/#Overview_Plot",
          "itemListElement": [{
            "@type": "HowToTip",
            "text": "A perfect xAI should obtain a score of 100% and finish all tests in the smallest amount of time. Therefore, it would be located on the top left."
          }, {
            "@type": "HowToDirection",
            "text": "Read the skyline of xAI with the highest performance."
          }, {
            "@type": "HowToDirection",
            "text": "choose between the fastest algorithm or the most “comprehensible” one from the skyline by clicking on the dot."
          }],
          "image": {
            "@type": "ImageObject",
            "url": "https://karim-53.github.io/cxai/rich_result/benchmark.png",
            "height": "580",
            "width": "800"
          }
        }, {
          "@type": "HowToStep",
          "name": "Read about the selected xAI algorithm",
          "url": "https://karim-53.github.io/cxai/#Explainer_details",
          "itemListElement": [{
            "@type": "HowToDirection",
            "text": "Learn about its main implementation concept and usecases."
          }, {
            "@type": "HowToDirection",
            "text": "Learn about its portability (supported models, xAI outputs, required data)."
          }, {
            "@type": "HowToDirection",
            "text": "Learn about its origin (source paper and source code)."
          }],
          "image": {
            "@type": "ImageObject",
            "url": "https://karim-53.github.io/cxai/rich_result/details.png",
            "height": "320",
            "width": "700"
          }
        }, {
          "@type": "HowToStep",
          "name": "Check the detailed limitations of the interpretability of its output",
          "url": "https://karim-53.github.io/cxai/#Explainer_limits",
          "itemListElement": [{
            "@type": "HowToDirection",
            "text": "Identify the tests that the xAI is failing."
          }, {
            "@type": "HowToDirection",
            "text": "Shortlist the relevant ones."
          }, {
            "@type": "HowToDirection",
            "text": "Apply the best practice tips to mitigate these limitations."
          }],
          "image": {
            "@type": "ImageObject",
            "url": "https://karim-53.github.io/cxai/rich_result/limit.png",
            "height": "599",
            "width": "891"
          }
        }
      ]
    }
  </script>
</head>

<body>
  <noscript>
    <h1>Compare-xAI</h1>
    <h2>A benchmark for feature importance explainable AI</h2>
    <p>Are you wondering what is the difference between public explainable AI (xAI) tools? Compare-xAI helps you:</p>
    <ol>
      <li>Shortlist xAI that fits your needs.</li>
      <li>Evaluate them using an intuitive scoring method.</li>
      <li>Select one xAI and learn more about its specific requirements.</li>
      <li>Learn the limits of the interpretability of its output.</li>
    </ol>
    <p>This interactive benchmark runs entirely in your browser and needs JavaScript enabled. You can still
      <a href="https://arxiv.org/pdf/2207.14160.pdf">read our paper</a>, browse the
      <a href="https://github.com/Karim-53/Compare-xAI#readme">source code on GitHub</a> or
      <a href="https://github.com/Karim-53/Compare-xAI/tree/main/data">download the raw data</a>.
    </p>
  </noscript>

  <div id="root">
    <div id="boot">
      <span></span>
      <p>Crunching the latest data, just for you. Hang tight…</p>
    </div>
  </div>
</body>

</html>
